name: Finalize Deadset ISO release

on:
  push:
    branches:
      - deadset-os-iso-build

permissions:
  actions: write
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            /repos/${{ github.repository }}/actions/runs/32272318097/cancel || true
          echo "The verified release from run 32272900995 remains authoritative."
