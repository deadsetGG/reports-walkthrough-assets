name: Deploy Walmart Run

on:
  push:
    branches: [main]
    paths:
      - 'walmart-run/**'
      - '.github/workflows/walmart-run-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: walmart-run-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: walmart-run
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
