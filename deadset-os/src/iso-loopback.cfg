set timeout=10
set default=0

menuentry "Deadset Ubuntu 26.04 Installer" {
  linux /casper/vmlinuz iso-scan/filename=${iso_path} quiet autoinstall ---
  initrd /casper/initrd
}

menuentry "Ubuntu Server Installer (stock/manual fallback)" {
  linux /casper/vmlinuz iso-scan/filename=${iso_path} quiet ---
  initrd /casper/initrd
}
