set timeout=10
set default=0

if loadfont unicode; then
  set gfxmode=auto
  insmod all_video
  terminal_output gfxterm
fi

menuentry "Deadset Ubuntu 26.04 Installer" {
  set gfxpayload=keep
  linux /casper/vmlinuz quiet autoinstall ---
  initrd /casper/initrd
}

menuentry "Ubuntu Server Installer (stock/manual fallback)" {
  set gfxpayload=keep
  linux /casper/vmlinuz quiet ---
  initrd /casper/initrd
}

if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI Firmware Settings" {
    fwsetup
  }
fi
